function orbitalXYZ(el,d){
  const N=rad(el.N[0]+el.N[1]*d),i=rad(el.i[0]+el.i[1]*d),w=rad(el.w[0]+el.w[1]*d);
  const a=el.a[0]+(el.a[1]||0)*d,e=el.e[0]+(el.e[1]||0)*d,M=rad(norm360(el.M[0]+el.M[1]*d));

          z:r*Math.sin(vw)*Math.sin(i)};
}

function tropicalLongitudes(date){

function westernPositions(date){
  const tropical=tropicalLongitudes(date);

  const bodies=[['Sun','Sun'],['Moon','Moon'],['Mercury','Mercury'],['Venus','Venus'],['Mars','Mars'],['Jupiter','Jupiter'],['Saturn','Saturn'],['Uranus','Uranus'],['Neptune','Neptune'],['Pluto','Pluto'],['North Node','Rahu'],['South Node','Ketu']];
  const combustionLimits={Mercury:8.5,Venus:8.5,Mars:8.5,Jupiter:8.5,Saturn:8.5};
  const sunLon=tropical.Sun;
  return bodies.map(([name,key])=>{
    const lon=norm360(tropical[key]),signIndex=Math.floor(lon/30),within=lon-signIndex*30;
    const delta=norm180(norm360(future[key])-lon);
    const retrograde=!['Sun','Moon','North Node','South Node'].includes(name)&&delta<0;
    const combust=!!combustionLimits[name]&&Math.abs(norm180(lon-sunLon))<=combustionLimits[name];

  });
}

  const names=['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Rahu','Ketu'];
  const now=names.map(name=>({name,lon:norm360(tropical[name]-ayanamsa)}));
  const future=tropicalLongitudes(new Date(date.getTime()+86400000));
  const combustionLimits={Mercury:14,Venus:10,Mars:17,Jupiter:11,Saturn:15};
  const sunLon=now.find(p=>p.name==='Sun').lon;
  return now.map(p=>{
    const signIndex=Math.floor(p.lon/30),within=p.lon-signIndex*30;
    const delta=norm180(norm360(future[p.name]-ayanamsa)-p.lon);
    const retrograde=!['Sun','Moon','Rahu','Ketu'].includes(p.name)&&delta<0;
    const combust=!!combustionLimits[p.name]&&Math.abs(norm180(p.lon-sunLon))<=combustionLimits[p.name];

  const response=await fetch('https://ipwho.is/',{signal:controller.signal,credentials:'omit',cache:'no-store'});
  if(!response.ok)throw new Error('IP location lookup failed');
  const data=await response.json();
  const latitude=Number(data.latitude),longitude=Number(data.longitude);
  if(!data.success||!Number.isFinite(latitude)||!Number.isFinite(longitude)||!data.city)throw new Error(data.message||'City not available from IP');
  if(requestVersion!==citySelectionVersion||selectedCity)return;
  const cityName=data.city,region=data.region||'',country=data.country||'';
  const city={name:cityName,admin1:region,country,latitude,longitude,timezone:data.timezone?.id||'UTC',label:[cityName,region,country].filter(Boolean).join(', '),source:'ip',detectedAt:Date.now()};
  saveCity(city,'ip');
 }catch(error){
  if(requestVersion===citySelectionVersion&&!selectedCity&&cityStatus)cityStatus.textContent='Automatic location unavailable. Search for a city to calculate its Lagna.';
 }finally{clearTimeout(timer)}
}
function localAscendant(date,lat,lon,zodiac='sidereal'){
  const jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
  const gmst=280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T-T*T*T/38710000;
  const ramcDeg=norm360(gmst+lon),ramc=rad(ramcDeg);
  const eps=rad(23.439291-.0130042*T);
  const phi=rad(Math.max(-89.8,Math.min(89.8,lat)));
  // The horizon/ecliptic intersection has two antipodal solutions.
  // Keep the one whose right ascension is east of the local meridian.
  const raw=norm360(deg(Math.atan2(-Math.cos(ramc),Math.sin(eps)*Math.tan(phi)+Math.cos(eps)*Math.sin(ramc))));
  const candidates=[raw,norm360(raw+180)];
  const tropical=candidates.find(lambda=>{
    const l=rad(lambda);
    const ra=norm360(deg(Math.atan2(Math.sin(l)*Math.cos(eps),Math.cos(l))));
    return norm360(ra-ramcDeg)<=180;
  })??raw;
  const ayanamsa=zodiac==='sidereal'?23.85675+((date.getTime()-Date.UTC(2000,0,1,12))/31557600000)*.013968:0;
  return norm360(tropical-ayanamsa);
}

function updatePlanetPanel(){
  const now=new Date(),western=chartStyle==='western';
  currentPositions=western?westernPositions(now):siderealPositions(now);
  const list=$('#planetPositions');
  if(list)list.innerHTML=currentPositions.map(p=>{
    const meta=(western?WESTERN_META:PLANET_META).find(x=>x[0]===p.name);
    const marks=(p.retrograde?'<sup class="planet-mark">R</sup>':'')+(p.combust?'<sup class="planet-mark">C</sup>':'');
    return '<li><span class="pl-name">'+(meta?.[1]||p.name.slice(0,2))+' · '+p.name+marks+'</span><span class="pl-sign">'+ZODIAC[p.signIndex]+'</span><span class="pl-degree">'+String(p.degree).padStart(2,'0')+'° '+String(p.minute).padStart(2,'0')+'′</span></li>';
  }).join('');
  const stamp=$('#skyUpdated');
  if(stamp)stamp.textContent='Updated '+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const ascBox=$('#ascendantInfo'),cityStatus=$('#cityStatus');
  if(selectedCity){
    const asc=localAscendant(now,selectedCity.latitude,selectedCity.longitude,western?'tropical':'sidereal');
    currentAscendant=asc;
    const sign=Math.floor(asc/30);
    if(ascBox){ascBox.hidden=false;ascBox.innerHTML='<span>'+(western?'Ascendant':'Ascendant / Lagna')+'</span><strong>'+ZODIAC[sign]+' '+String(Math.floor(asc%30)).padStart(2,'0')+'°</strong>'}
    if(cityStatus){
      const source=selectedCity.source==='ip'?'Approximate IP location · ':'Local chart · ';
      cityStatus.textContent=western?source+selectedCity.label+' · Tropical Ascendant: '+ZODIAC[sign]+' rising':source+selectedCity.label+' · Sidereal Lagna: '+ZODIAC[sign]+' rising';
    }
  }else{
    currentAscendant=null;
    if(ascBox)ascBox.hidden=true;
    if(cityStatus)cityStatus.textContent='Choose a city to calculate its local Ascendant.';
  }
  const methodNote=$('#skyMethodNote');
  if(methodNote)methodNote.textContent=western?'Western tropical zodiac · geocentric positions · major aspects · refreshed every 30 seconds.':'Approximate sidereal positions · refreshed every 30 seconds. Ascendant uses selected city coordinates.';
  drawChart(chartStyle);
  renderWesternAspects();
}
function planetSvgLabel(p){
  const meta=(chartStyle==='western'?WESTERN_META:PLANET_META).find(x=>x[0]===p.name);const abbr=meta?.[1]||p.name.slice(0,2);
  const marks=(p.retrograde?'<tspan font-size="6" baseline-shift="super" fill="var(--rose)">R</tspan>':'')+(p.combust?'<tspan font-size="6" baseline-shift="super" fill="var(--accent)">C</tspan>':'');
  return abbr+marks;
}
function planetLabelsFor(signIndex){
  return currentPositions.filter(p=>p.signIndex===signIndex).map(planetSvgLabel).join(' ');
}
function renderWesternAspects(){
  const box=$('#westernAspects');if(!box)return;
  if(chartStyle!=='western'){box.hidden=true;box.innerHTML='';return}
  box.hidden=false;
  const planets=currentPositions.filter(p=>!['North Node','South Node'].includes(p.name));
  const definitions=[
    {angle:0,name:'Conjunction',symbol:'☌',orb:8},
    {angle:60,name:'Sextile',symbol:'⚹',orb:5},
    {angle:90,name:'Square',symbol:'□',orb:7},
    {angle:120,name:'Trine',symbol:'△',orb:7},
    {angle:180,name:'Opposition',symbol:'☍',orb:8}
  ];
  const found=[];
  for(let i=0;i<planets.length;i++)for(let j=i+1;j<planets.length;j++){
    const a=planets[i],b=planets[j],distance=Math.abs(norm180(a.lon-b.lon));
    for(const aspect of definitions){
      const orb=Math.abs(distance-aspect.angle);
      const luminary=['Sun','Moon'].includes(a.name)||['Sun','Moon'].includes(b.name);
      const allowed=aspect.orb+(luminary?2:0);
      if(orb<=allowed)found.push({a:a.name,b:b.name,...aspect,orb});
    }
  }
  found.sort((a,b)=>a.orb-b.orb);
  const fmt=n=>{const d=Math.floor(n),m=Math.round((n-d)*60);return d+'° '+String(m).padStart(2,'0')+'′'};
  box.innerHTML='<div class="western-aspects-head"><strong>Major aspects</strong><span>Tropical · 5 major aspects</span></div>'+
    (found.length?'<ul>'+found.slice(0,8).map(x=>'<li><span class="aspect-symbol">'+x.symbol+'</span><span class="aspect-pair">'+x.a+' · '+x.b+'</span><span class="aspect-name">'+x.name+'</span><span class="aspect-orb">'+fmt(x.orb)+'</span></li>').join('')+'</ul>':'<p class="western-aspects-empty">No major aspects within the selected orbs.</p>');
}
function drawChart(style){
  const w=$('#wheel');if(!w)return;
  if(style==='western'){
    w.setAttribute('viewBox','-110 -110 220 220');w.setAttribute('aria-label','Western tropical zodiac wheel with current planetary positions');
    const glyph=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
    let h='';
    for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%6?2.5:5,s=Math.sin(a),c=-Math.cos(a);h+='<line x1="'+(104*s)+'" y1="'+(104*c)+'" x2="'+((104+l)*s)+'" y2="'+((104+l)*c)+'" stroke="var(--muted)" stroke-width=".7" opacity=".6"/>'}
    h+='<circle r="104" fill="none" stroke="var(--line)"/><circle r="70" fill="none" stroke="var(--line)"/>';
    for(let i=0;i<12;i++){const a=i*Math.PI/6,b=a-Math.PI/12,x=87*Math.sin(a),y=-87*Math.cos(a),items=currentPositions.filter(p=>p.signIndex===i);
      h+='<line x1="'+(70*Math.sin(b))+'" y1="'+(-70*Math.cos(b))+'" x2="'+(104*Math.sin(b))+'" y2="'+(-104*Math.cos(b))+'" stroke="var(--line)"/>';
      h+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="17" fill="var(--ink)">'+glyph[i]+'</text>';
      if(items.length)h+='<text x="'+x+'" y="'+(y+19)+'" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--accent)">'+items.map(planetSvgLabel).join(' ')+'</text>';
    }
    if(currentAscendant!==null){const a=rad(currentAscendant),sx=Math.sin(a),cy=-Math.cos(a);h+='<line x1="'+(88*sx)+'" y1="'+(88*cy)+'" x2="'+(108*sx)+'" y2="'+(108*cy)+'" stroke="var(--accent)" stroke-width="2.5"/><text x="'+(116*sx)+'" y="'+(116*cy+3)+'" text-anchor="middle" font-size="7" font-weight="700" fill="var(--accent)">ASC</text>'}
    w.innerHTML=h;return;
  }
  w.setAttribute('viewBox','0 0 240 240');
  const signs=[
    [12,37.5,37.5],[1,92.5,37.5],[2,147.5,37.5],[3,202.5,37.5],
    [11,37.5,92.5],[4,202.5,92.5],[10,37.5,147.5],[5,202.5,147.5],
    [6,37.5,202.5],[7,92.5,202.5],[8,147.5,202.5],[9,202.5,202.5]
  ];
  if(style==='south'){
    w.setAttribute('aria-label','South Indian sidereal planetary chart');
    let h='<rect x="10" y="10" width="220" height="220" fill="none" stroke="var(--accent)" stroke-width="1.2"/>';
    h+='<path d="M65 10V230 M175 10V230 M120 10V65 M120 175V230 M10 65H230 M10 175H230 M10 120H65 M175 120H230" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
    const ascSign=currentAscendant===null?null:Math.floor(currentAscendant/30);
    signs.forEach(c=>{const i=c[0]-1,items=planetLabelsFor(i),isAsc=i===ascSign;h+='<text x="'+c[1]+'" y="'+(c[2]-5)+'" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-weight="600">'+c[0]+(isAsc?' · ASC':'')+'</text>';if(items)h+='<text x="'+c[1]+'" y="'+(c[2]+10)+'" text-anchor="middle" font-size="9" fill="var(--ink)" font-weight="600">'+items+'</text>'});
    h+='<text x="120" y="113" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="sans-serif">CURRENT</text><text x="120" y="129" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="sans-serif">SIDEREAL SKY</text>';
    w.innerHTML=h;return;
  }
  w.setAttribute('aria-label','North Indian sidereal planetary chart');
  let h='<rect x="10" y="10" width="220" height="220" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M10 10L230 230 M230 10L10 230 M120 10L230 120L120 230L10 120Z" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
  const cells=[[1,120,65],[2,65,31],[3,31,65],[4,65,120],[5,31,175],[6,65,209],[7,120,175],[8,175,209],[9,209,175],[10,175,120],[11,209,65],[12,175,31]];
  const ascSign=currentAscendant===null?0:Math.floor(currentAscendant/30);
  cells.forEach(c=>{const houseIndex=c[0]-1,signIndex=(ascSign+houseIndex)%12,signNumber=signIndex+1,items=planetLabelsFor(signIndex),isAsc=houseIndex===0;h+='<text x="'+c[1]+'" y="'+(c[2]-(isAsc?12:5))+'" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">'+signNumber+'</text>';if(isAsc&&currentAscendant!==null)h+='<text x="'+c[1]+'" y="'+(c[2]-2)+'" text-anchor="middle" font-size="5.5" font-weight="700" letter-spacing=".5" fill="var(--accent)">ASC / LAGNA</text>';if(items)h+='<text x="'+c[1]+'" y="'+(c[2]+(isAsc?12:10))+'" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">'+items+'</text>'});
  w.innerHTML=h;
}
$('#chartStyle')?.addEventListener('change',e=>{chartStyle=e.target.value;updatePlanetPanel()});
function setGrahaTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('graha-theme',theme)}catch(e){}const b=$('#themeToggle');if(b){b.textContent=theme==='dark'?'☼ Light':'☾ Dark';b.setAttribute('aria-label',theme==='dark'?'Switch to light theme':'Switch to dark theme')}const m=$('#browserThemeColor');if(m)m.content=theme==='dark'?'#120D1A':'#F7F4F9'}
$('#themeToggle')?.addEventListener('click',()=>setGrahaTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
setGrahaTheme(document.documentElement.dataset.theme||'dark');
updatePlanetPanel();
presetCityFromIP();
setInterval(updatePlanetPanel,30000);
render();

</script>
