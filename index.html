:root[data-theme="light"]{color-scheme:light;--bg:#F7F4F9;--surface:#fff;--ink:#241633;--muted:#74688A;--line:#E6DFEE;--accent:#D49A24;--accent-ink:#241633;--rose:#B8456B}
.theme-toggle{flex:none;border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 11px var(--ui);white-space:nowrap;cursor:pointer;transition:border-color .18s,background .18s}
.theme-toggle:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.skyhead{flex-wrap:nowrap}

.feature-intro{padding:24px 22px 18px;border-bottom:1px solid var(--line)}
.feature-intro h2{font:500 27px var(--body);margin:5px 0 4px}
.feature-intro p{margin:0;color:var(--muted);max-width:680px}
.feature-form{margin:16px 18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--surface) 78%,transparent)}
.feature-form h3{font:600 16px var(--ui);margin:0 0 10px}
.feature-form .ed{margin-top:0}
.feature-list{padding:0 18px 24px}
.feature-card{padding:18px 4px;border-bottom:1px solid var(--line)}
.feature-card h3{font:500 21px/1.3 var(--body);margin:8px 0}
.feature-card>p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.feature-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.feature-tag,.status-pill{font:600 12px var(--ui);border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.status-pill{color:var(--muted);background:var(--surface)}.status-open{color:#3FA37A}.status-closed{color:var(--accent)}
.feature-replies{margin:12px 0 0 10px;padding-left:12px;border-left:2px solid var(--line)}
.feature-replies>div{padding:7px 0}.feature-replies b{font:600 12px var(--ui)}.feature-replies p{margin:2px 0}
.feature-reply,.resolve-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.feature-reply input,.resolve-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:8px 12px}
.feature-reply .btn,.resolve-row .btn{white-space:nowrap}
.prediction-period{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}.prediction-period label{min-width:0}.prediction-period input{width:100%;min-width:0}.period-separator{padding:0 2px 10px;color:var(--muted);font:500 13px var(--ui)}
@media(max-width:420px){.prediction-period{grid-template-columns:1fr;gap:7px}.period-separator{padding:0}}
.prediction-stats{display:flex;gap:24px;margin-top:16px}
.prediction-stats div{display:grid;gap:0}.prediction-stats strong{font:600 21px var(--ui);color:var(--accent)}.prediction-stats span{font:12px var(--ui);color:var(--muted)}
.outcome{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.outcome p{margin:4px 0}.outcome .hint{display:block;margin-top:5px}
@media(max-width:700px){.feature-intro{padding:20px 16px}.feature-form{margin:12px 12px;padding:14px}.feature-list{padding:0 16px 20px}.feature-reply,.resolve-row{flex-wrap:wrap}.feature-reply input,.resolve-row input{flex-basis:100%}.prediction-stats{gap:20px}}
</style>

const $=s=>document.querySelector(s);let tT;const SV=d=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;const IRP=SV('<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>'),IQ=SV('<path d="M14 14a2 2 0 0 0 2-2V8h-2"/><path d="M8 14a2 2 0 0 0 2-2V8H8"/><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),IH=SV('<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>');const qt=(id,x)=>{const o=S.posts.find(p=>p.id===id);return o?`<div class="qt">${x?'<button data-act="unquote" aria-label="Remove quote" class="qx">✕</button>':''}${nm(o.a)}<div>${esc(o.t)}</div></div>`:''};const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800)};

const ok=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'');

/^\+?[\d\s-]{7,16}$/.test(l.tel||'')&&r.push(`<a href="tel:${l.tel.replace(/[^\d+]/g,'')}">${esc(l.tel)}</a>`);

const PLANET_META=[
  ['Sun','Su'],['Moon','Mo'],['Mercury','Me'],['Venus','Ve'],['Mars','Ma'],
  ['Jupiter','Ju'],['Saturn','Sa'],['Uranus','Ur'],['Neptune','Ne'],['Rahu','Ra'],['Ketu','Ke']
];
const norm360=x=>((x%360)+360)%360;
const rad=x=>x*Math.PI/180;
const deg=x=>x*180/Math.PI;
function orbitalXYZ(el,d){
  const N=rad(el.N[0]+el.N[1]*d),i=rad(el.i[0]+el.i[1]*d),w=rad(el.w[0]+el.w[1]*d);
  const a=el.a[0]+(el.a[1]||0)*d,e=el.e[0]+(el.e[1]||0)*d,M=rad(norm360(el.M[0]+el.M[1]*d));
  let E=M;
  for(let k=0;k<8;k++) E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
  const v=Math.atan2(yv,xv),r=Math.hypot(xv,yv),vw=v+w;
  return {x:r*(Math.cos(N)*Math.cos(vw)-Math.sin(N)*Math.sin(vw)*Math.cos(i)),
          y:r*(Math.sin(N)*Math.cos(vw)+Math.cos(N)*Math.sin(vw)*Math.cos(i)),
          z:r*Math.sin(vw)*Math.sin(i)};
}
const ORBITS={
 Mercury:{N:[48.3313,3.24587e-5],i:[7.0047,5e-8],w:[29.1241,1.01444e-5],a:[.387098,0],e:[.205635,5.59e-10],M:[168.6562,4.0923344368]},
 Venus:{N:[76.6799,2.46590e-5],i:[3.3946,2.75e-8],w:[54.8910,1.38374e-5],a:[.723330,0],e:[.006773,-1.302e-9],M:[48.0052,1.6021302244]},
 Earth:{N:[0,0],i:[0,0],w:[282.9404,4.70935e-5],a:[1,0],e:[.016709,-1.151e-9],M:[356.0470,.9856002585]},

 Jupiter:{N:[100.4542,2.76854e-5],i:[1.3030,-1.557e-7],w:[273.8777,1.64505e-5],a:[5.20256,0],e:[.048498,4.469e-9],M:[19.8950,.0830853001]},
 Saturn:{N:[113.6634,2.38980e-5],i:[2.4886,-1.081e-7],w:[339.3939,2.97661e-5],a:[9.55475,0],e:[.055546,-9.499e-9],M:[316.9670,.0334442282]},
 Uranus:{N:[74.0005,1.3978e-5],i:[.7733,1.9e-8],w:[96.6612,3.0565e-5],a:[19.18171,-1.55e-8],e:[.047318,7.45e-9],M:[142.5905,.011725806]},
 Neptune:{N:[131.7806,3.0173e-5],i:[1.77,-2.55e-7],w:[272.8461,-6.027e-6],a:[30.05826,3.313e-8],e:[.008606,2.15e-9],M:[260.2471,.005995147]}
};
function tropicalLongitudes(date){
  const jd=date.getTime()/86400000+2440587.5,d=jd-2451543.5;
  const earth=orbitalXYZ(ORBITS.Earth,d),out={};
  for(const name of Object.keys(ORBITS)){
    if(name==='Earth')continue;
    const p=orbitalXYZ(ORBITS[name],d);
    out[name]=norm360(deg(Math.atan2(p.y-earth.y,p.x-earth.x)));
  }
  out.Sun=norm360(out.Earth===undefined?deg(Math.atan2(-earth.y,-earth.x)):out.Earth);
  // Geocentric lunar orbit; low-order orbital solution.
  const moon=orbitalXYZ({N:[125.1228,-.0529538083],i:[5.1454,0],w:[318.0634,.1643573223],a:[60.2666,0],e:[.0549,0],M:[115.3654,13.0649929509]},d);
  out.Moon=norm360(deg(Math.atan2(moon.y,moon.x)));
  const node=norm360(125.04452-.0529538083*d);
  out.Rahu=node;out.Ketu=norm360(node+180);
  return out;
}
function siderealPositions(date){
  const tropical=tropicalLongitudes(date);
  const years=(date.getTime()-Date.UTC(2000,0,1,12))/31557600000;
  const ayanamsa=23.85675+years*.013968;
  const names=['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Rahu','Ketu'];
  const now=names.map(name=>({name,lon:norm360(tropical[name]-ayanamsa)}));
  const future=tropicalLongitudes(new Date(date.getTime()+86400000));
  const combustionLimits={Mercury:14,Venus:10,Mars:17,Jupiter:11,Saturn:15};
  const sunLon=now.find(p=>p.name==='Sun').lon;
  return now.map(p=>{
    const signIndex=Math.floor(p.lon/30),within=p.lon-signIndex*30;
    const delta=norm180(norm360(future[p.name]-ayanamsa)-p.lon);
    const retrograde=!['Sun','Moon','Rahu','Ketu'].includes(p.name)&&delta<0;
    const combust=!!combustionLimits[p.name]&&Math.abs(norm180(p.lon-sunLon))<=combustionLimits[p.name];
    return {...p,signIndex,degree:Math.floor(within),minute:Math.floor((within-Math.floor(within))*60),retrograde,combust};
  });
}
function norm180(x){return x>180?x-360:x<-180?x+360:x}

function localAscendant(date,lat,lon){
  const jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
  let gmst=280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T-T*T*T/38710000;
  const ramc=rad(norm360(gmst+lon));
  const eps=rad(23.439291-.0130042*T);
  const phi=rad(Math.max(-89.8,Math.min(89.8,lat)));
  const tropical=norm360(deg(Math.atan2(-Math.cos(ramc),Math.sin(eps)*Math.tan(phi)+Math.cos(eps)*Math.sin(ramc))));
  const ayanamsa=23.85675+((date.getTime()-Date.UTC(2000,0,1,12))/31557600000)*.013968;
  return norm360(tropical-ayanamsa);
}

function updatePlanetPanel(){
  const now=new Date();currentPositions=siderealPositions(now);
  const list=$('#planetPositions');
  if(list)list.innerHTML=currentPositions.map(p=>{
    const meta=PLANET_META.find(x=>x[0]===p.name);
    const marks=(p.retrograde?'<sup class="planet-mark">R</sup>':'')+(p.combust?'<sup class="planet-mark">C</sup>':'');
    return '<li><span class="pl-name">'+meta[1]+' · '+p.name+marks+'</span><span class="pl-sign">'+ZODIAC[p.signIndex]+'</span><span class="pl-degree">'+String(p.degree).padStart(2,'0')+'° '+String(p.minute).padStart(2,'0')+'′</span></li>';
  }).join('');
  const stamp=$('#skyUpdated');
  if(stamp)stamp.textContent='Updated '+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const ascBox=$('#ascendantInfo'),cityStatus=$('#cityStatus');
  if(selectedCity){
    const asc=localAscendant(now,selectedCity.latitude,selectedCity.longitude),sign=Math.floor(asc/30),houseLabels=['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'];
    if(ascBox){ascBox.hidden=false;ascBox.innerHTML='<span>Ascendant / Lagna</span><strong>'+ZODIAC[sign]+' '+String(Math.floor(asc%30)).padStart(2,'0')+'°</strong>'}

  }else{
    if(ascBox)ascBox.hidden=true;
    if(cityStatus)cityStatus.textContent='Choose a city to calculate its local Ascendant and house sequence.';
  }

}
function planetSvgLabel(p){
  const abbr=PLANET_META.find(x=>x[0]===p.name)[1];
  const marks=(p.retrograde?'<tspan font-size="6" baseline-shift="super" fill="var(--rose)">R</tspan>':'')+(p.combust?'<tspan font-size="6" baseline-shift="super" fill="var(--accent)">C</tspan>':'');
  return abbr+marks;
}
function planetLabelsFor(signIndex){
  return currentPositions.filter(p=>p.signIndex===signIndex).map(planetSvgLabel).join(' ');
}
function drawChart(style){

      h+='<line x1="'+(70*Math.sin(b))+'" y1="'+(-70*Math.cos(b))+'" x2="'+(104*Math.sin(b))+'" y2="'+(-104*Math.cos(b))+'" stroke="var(--line)"/>';
      h+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="17" fill="var(--ink)">'+glyph[i]+'</text>';
      if(items.length)h+='<text x="'+x+'" y="'+(y+19)+'" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--accent)">'+items.map(planetSvgLabel).join(' ')+'</text>';
    }
    w.innerHTML=h;return;
  }
  w.setAttribute('viewBox','0 0 240 240');
  const signs=[
    [12,37.5,37.5],[1,92.5,37.5],[2,147.5,37.5],[3,202.5,37.5],
    [11,37.5,92.5],[4,202.5,92.5],[10,37.5,147.5],[5,202.5,147.5],

  ];
  if(style==='south'){
    w.setAttribute('aria-label','South Indian sidereal planetary chart');

    signs.forEach(c=>{const i=c[0]-1,items=planetLabelsFor(i);h+='<text x="'+c[1]+'" y="'+(c[2]-5)+'" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-weight="600">'+c[0]+'</text>';if(items)h+='<text x="'+c[1]+'" y="'+(c[2]+10)+'" text-anchor="middle" font-size="9" fill="var(--ink)" font-weight="600">'+items+'</text>'});

    w.innerHTML=h;return;
  }
  w.setAttribute('aria-label','North Indian sidereal planetary chart');
  let h='<rect x="10" y="10" width="220" height="220" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M10 10L230 230 M230 10L10 230 M120 10L230 120L120 230L10 120Z" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
  const cells=[[1,120,65],[2,65,31],[3,31,65],[4,65,120],[5,31,175],[6,65,209],[7,120,175],[8,175,209],[9,209,175],[10,175,120],[11,209,65],[12,175,31]];
